[build-system]
requires = ["setuptools>=69", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "nle-utils"
version = "2.1.3"
description = "Utilities for the NetHack Learning Environment."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Bartek Cupial" },
]
keywords = ["nethack", "nle", "utils", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "colorlog",
    "debugpy",
    "gymnasium",
    "matplotlib",
    "numba",
    "numpy",
    "opencv-python",
    "pandas",
    "pillow",
    "psutil",
    "scipy",
    "seaborn",
    "setuptools",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/BartekCupial/nle-utils"
Issues = "https://github.com/BartekCupial/nle-utils/issues"
Repository = "https://github.com/BartekCupial/nle-utils"

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "flake8",
    "isort>=5.12",
    "pre-commit",
    "pytest<8.0",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nle_utils = [
    "Hack-Regular.ttf",
    "tilesets/*.png",
]

[tool.black]
line-length = 120
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
py_version = 38
line_length = 120
profile = "black"
known_third_party = ["nle"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
